<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }
        .box {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;

            box-shadow: 0 0 10px gray;

            width: 90%;

        }
        button {
            padding: 10px;
            background: green;
            color: white;

            border-radius: 5px;
        }
        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Add Student</h2>

    <form action="insertStudent.php" method="POST">
        <input type="text" name="name" placeholder="Enter Name" required><br>
        <input type="email" name="email" placeholder="Enter Email" required><br>
        <button type="submit">Add Student</button>
    </form>
</div>

</body>
</html>
