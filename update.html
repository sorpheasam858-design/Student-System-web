<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Student</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }
        .box {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        input {
            width: 90%;
            padding: 8px;
            margin: 10px 0;
        }
        button {
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Update Student</h2>

    <form action="updateStudent.php" method="POST">
        <input type="hidden" name="id" value="1">

        <label>Name:</label><br>
        <input type="text" name="name" value="John Doe" required><br>

        <label>Email:</label><br>
        <input type="email" name="email" value="john@gmail.com" required><br>

        <button type="submit">Update</button>
    </form>
</div>

</body>
</html>
